name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build production binary
        run: go build -trimpath -ldflags "-s -w" -o bin/ycode ./cmd/ycode

      - name: Smoke test CLI
        run: |
          ./bin/ycode version
          ./bin/ycode map --tokens 300 "provider streaming"
          ./bin/ycode benchmark --map-tokens 300 "provider streaming"
